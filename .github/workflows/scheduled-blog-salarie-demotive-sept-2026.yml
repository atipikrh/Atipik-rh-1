# Redéploiement production — article blog salarié démotivé / bilan de compétences.
# Publication cible : 22 septembre 2026 à 07:00 (Europe/Paris) = 05:00 UTC.
name: Déploiement blog salarié démotivé sept. 2026

on:
  schedule:
    - cron: '0 5 22 9 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déclencher le build Vercel (commit vide)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: déploiement production programmé — article blog salarié démotivé (22 sept. 2026)"
          git push

      - name: Vérification SEO post-déploiement
        run: node scripts/post-deploy-seo.mjs
        env:
          SITE_URL: https://www.atipikrh.com
