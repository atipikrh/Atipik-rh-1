# Redéploiement production — articles blog formations courtes (chiffre d'affaires).
# Chaque cron correspond à 8 h Europe/Paris le jour exact.
# Heure d'été (UTC+2) jusqu'au 25 octobre : 06:00 UTC.
# Heure d'hiver (UTC+1) à partir du 25 octobre : 07:00 UTC.
name: Déploiement blog formations courtes oct. 2026

on:
  schedule:
    - cron: '0 6 7 10 *'
    - cron: '0 6 8 10 *'
    - cron: '0 6 13 10 *'
    - cron: '0 6 15 10 *'
    - cron: '0 6 20 10 *'
    - cron: '0 6 22 10 *'
    - cron: '0 7 27 10 *'
    - cron: '0 7 29 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déclencher le build Vercel (commit vide)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: déploiement production programmé — blog formations courtes (${{ github.event.schedule }})"
          git push

      - name: Vérification SEO post-déploiement
        run: node scripts/post-deploy-seo.mjs
        env:
          SITE_URL: https://www.atipikrh.com
