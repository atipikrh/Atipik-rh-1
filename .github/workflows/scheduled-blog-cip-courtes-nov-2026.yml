# Redéploiement — articles CIP et formations courtes (mardi / jeudi 6 h Paris = 05:00 UTC, heure d'hiver).
name: Déploiement blog CIP et formations courtes nov. 2026

on:
  schedule:
    - cron: '0 5 24 11 *'
    - cron: '0 5 26 11 *'
    - cron: '0 5 1 12 *'
    - cron: '0 5 3 12 *'
    - cron: '0 5 8 12 *'
    - cron: '0 5 10 12 *'
    - cron: '0 5 15 12 *'
    - cron: '0 5 17 12 *'
    - cron: '0 5 22 12 *'
    - cron: '0 5 24 12 *'
    - cron: '0 5 29 12 *'
    - cron: '0 5 31 12 *'
    - cron: '0 5 5 1 *'
    - cron: '0 5 7 1 *'
    - cron: '0 5 12 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déclencher le build Vercel (commit vide)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: déploiement production programmé — blog CIP et formations courtes (${{ github.event.schedule }})"
          git push

      - name: Vérification SEO post-déploiement
        run: node scripts/post-deploy-seo.mjs
        env:
          SITE_URL: https://www.atipikrh.com
