# Redéploiement production programmé — article blog 10 usages IA CIP.
# Publication cible : 10 septembre 2026 à 07:00 (Europe/Paris) = 05:00 UTC.
#
# Stratégie : merger la PR le jeudi 10 septembre au matin (ou garder la branche jusqu'à ce jour).
# Le cron force un rebuild Vercel + ping SEO ; l'article est live dès que le code est sur main.
name: Déploiement blog 10 usages IA CIP sept. 2026

on:
  schedule:
    - cron: '0 5 10 9 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déclencher le build Vercel (commit vide)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: déploiement production programmé — article blog 10 usages IA CIP (10 sept. 2026)"
          git push

      - name: Vérification SEO post-déploiement
        run: node scripts/post-deploy-seo.mjs
        env:
          SITE_URL: https://www.atipikrh.com
